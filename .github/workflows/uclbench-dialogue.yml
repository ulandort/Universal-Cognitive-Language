name: UCLBench autonomous dialogue (manual)

on:
  workflow_dispatch:
    inputs:
      paid_run:
        description: 'Make paid Radium requests? no = free offline simulation'
        required: true
        type: choice
        options: ['no', 'yes']
        default: 'no'
      turns:
        description: 'Number of generated turns per format'
        required: true
        type: choice
        options: ['4', '6', '8']
        default: '6'
      trials:
        description: 'Conversation repetitions (trial 2 reverses starting speaker)'
        required: true
        type: choice
        options: ['1', '2']
        default: '2'
      cap_usd:
        description: 'Estimated per-run USD reservation limit, not provider billing cap'
        required: true
        type: choice
        options: ['2.00', '4.00', '6.00', '8.00']
        default: '4.00'

permissions:
  contents: read
concurrency:
  group: uclbench-dialogue-paid-manual
  cancel-in-progress: false

jobs:
  dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/2.0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression suite and simulated dialogue (free)
        run: |
          python -m unittest discover -s benchmarks -p 'test_live_dialogue.py' -v
          python benchmarks/live_dialogue.py --dry-run --trials 2 --turns 6 --output dialogue-dry-run.json
      - name: Install Radium compatible client (paid only)
        if: inputs.paid_run == 'yes'
        run: python -m pip install 'openai>=1.0,<3.0'
      - name: Live AI-to-AI dialogue with one bounded same-speaker recovery per failed turn
        if: inputs.paid_run == 'yes'
        env:
          RADIUM_API_KEY: ${{ secrets.RADIUM_API_KEY }}
          TURNS: ${{ inputs.turns }}
          TRIALS: ${{ inputs.trials }}
          CAP: ${{ inputs.cap_usd }}
        run: python benchmarks/live_dialogue.py --turns "$TURNS" --trials "$TRIALS" --cap-usd "$CAP" --output dialogue-live.json
      - name: Upload transcripts and scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uclbench-autonomous-dialogue-results
          path: |
            dialogue-dry-run.json
            dialogue-live.json
          if-no-files-found: warn
          retention-days: 14
