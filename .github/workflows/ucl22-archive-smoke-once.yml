name: One-time UCL 2.2 live archive smoke test

on:
  push:
    branches: [ucl22-archive-smoke-once]
    paths:
      - '.github/workflows/ucl22-archive-smoke-once.yml'

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.created && github.run_attempt == 1 && github.repository == 'ulandort/Universal-Cognitive-Language'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify archive fixture and estimate
        run: python benchmarks/archive_live_once.py --dry-run
      - name: Install model client
        run: python -m pip install 'openai>=1.0,<3.0'
      - name: Run one model continuation
        env:
          RADIUM_API_KEY: ${{ secrets.RADIUM_API_KEY }}
        run: python benchmarks/archive_live_once.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ucl22-archive-smoke
          path: |
            archive-live-report.json
            archive-live-continued.txt
