name: UCL 2.0 One-Time Cold Recipient Deception Study

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ucl2-cold-reader-once.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ucl2-cold-reader-deception-one-time
  cancel-in-progress: false

jobs:
  cold_reader:
    if: github.repository == 'ulandort/Universal-Cognitive-Language' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve actual CG-2 authentic model-authored historical packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cold-source
          gh run download 45089101962 --repo "$GITHUB_REPOSITORY" -n ucl2-cg2-eight-turn-challenge --dir cold-source
          test -s cold-source/cg2-live.json
      - name: Free attack/identity consistency, strict scoring, no-network 8-case preflight
        env:
          CG2_SOURCE_PATH: cold-source/cg2-live.json
        run: |
          python -m unittest discover -s benchmarks -p 'test_cold_recipient_attack.py' -v
          python benchmarks/cold_recipient_attack.py --source "$CG2_SOURCE_PATH" --dry-run --output cold-reader-dry.json
      - name: Install client only after free conformance tests pass
        run: python -m pip install 'openai>=1.0,<3.0'
      - name: Eight cold-reader Clarke/Hal comparisons (2 formats x attack/control), estimated $3.50 limit
        env:
          RADIUM_API_KEY: ${{ secrets.RADIUM_API_KEY }}
        run: |
          python benchmarks/cold_recipient_attack.py --source cold-source/cg2-live.json --cap-usd 3.50 --output cold-reader-live.json
      - name: Preserve genuine history, all raw recipient replies and scored outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucl2-cold-reader-deception-study
          path: |
            cold-source/cg2-live.json
            cold-reader-dry.json
            cold-reader-live.json
          retention-days: 14
