name: Publish UCL 2.2.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ucl22-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ucl-2-1-0-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ulandort/Universal-Cognitive-Language' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run reference and offline benchmark tests
        run: |
          python -m pip install -r requirements-optional.txt
          python -m unittest discover -s tests
          python -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Validate the downloadable packets and a continued Challenge
        run: |
          mkdir -p release-assets
          cp examples/quickstart.txt release-assets/ucl-2.2-quickstart.txt
          cp examples/challenge.txt release-assets/ucl-2.2-challenge.txt
          cp examples/challenge_reply.json release-assets/ucl-2.2-challenge-reply.json
          python benchmarks/long_join.py --turns 2000 --pack --out release-assets/ucl-2.2-archive.txt
          for packet in release-assets/*.txt; do
            python src/ucl.py check "$packet"
            node tools/check_ucl_portable.js "$packet"
          done
          python src/ucl.py continue release-assets/ucl-2.2-challenge.txt continued.txt < release-assets/ucl-2.2-challenge-reply.json
          python src/ucl.py inspect continued.txt --json
          node tools/check_ucl_portable.js continued.txt
          python src/ucl.py inspect release-assets/ucl-2.2-archive.txt --act t185
      - name: Publish v2.2.0 from the tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.2.0 --json tagName >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/v2.2.0" --jq .sha)" = "$GITHUB_SHA"
          else
            gh release create v2.2.0 release-assets/* \
              --target "$GITHUB_SHA" \
              --title "UCL 2.2.0 — Portable" \
              --notes-file RELEASE_NOTES_2_2.md \
              --latest
          fi
          gh release view v2.2.0 --json tagName,isDraft,isPrerelease,url,assets
