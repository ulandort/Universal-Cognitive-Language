name: UCLBench optional formula-role comparison (manual)

on:
  workflow_dispatch:
    inputs:
      paid_run:
        description: 'Real Radium calls? no is free deterministic fixture validation'
        type: choice
        required: true
        default: 'no'
        options: ['no', 'yes']
      cap_usd:
        description: 'Estimated software spending cap (provider timeout billing not guaranteed)'
        type: choice
        required: true
        default: '4.00'
        options: ['2.00', '4.00', '6.00']

permissions:
  contents: read

concurrency:
  group: uclbench-formula-roles-manual
  cancel-in-progress: false

jobs:
  formula_roles:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/2.0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free optional role conformance and deterministic paired oracle
        run: |
          python -m unittest discover -s benchmarks -p 'test_formula_roles_experiment.py' -v
          python benchmarks/formula_roles_experiment.py --dry-run --output formula-roles-dry.json
      - name: Install provider client only when explicitly authorized
        if: inputs.paid_run == 'yes'
        run: python -m pip install 'openai>=1.0,<3.0'
      - name: Matched original versus optional formula-role interpretations
        if: inputs.paid_run == 'yes'
        env:
          RADIUM_API_KEY: ${{ secrets.RADIUM_API_KEY }}
          CAP: ${{ inputs.cap_usd }}
        run: python benchmarks/formula_roles_experiment.py --cap-usd "$CAP" --output formula-roles-live.json
      - name: Preserve paired results and verbatim model responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uclbench-formula-role-results
          path: |
            formula-roles-dry.json
            formula-roles-live.json
          retention-days: 14
