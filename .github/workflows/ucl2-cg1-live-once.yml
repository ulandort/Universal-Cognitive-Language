name: UCL 2.0 One-Time Live Four-Turn CG-1 Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ucl2-cg1-live-once.yml'

permissions:
  contents: read

concurrency:
  group: ucl2-cg1-postrelease-live-one-time
  cancel-in-progress: false

jobs:
  live_postrelease_genesis:
    if: github.repository == 'ulandort/Universal-Cognitive-Language' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require official stable v2.0.0 tag and independently valid Portable envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.0 --json tagName,isDraft,isPrerelease
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          import sap_portable
          assert sap_portable.FORMAT=='UCL/2.0-SAP1-PORTABLE'
          assert sap_portable.RULES['status']=='stable-2.0'
          PY
      - name: Free postrelease four-turn original-concept tests
        run: |
          python -m unittest discover -s benchmarks -p 'test_concept_genesis.py' -v
          python benchmarks/concept_genesis.py --dry-run --turns 4 --output cg1-postrelease-dry.json
      - name: Install provider SDK
        run: python -m pip install 'openai>=1.0,<3.0'
      - name: Small genuine Clarke/Hal CG-1 trial — 4 turns, estimated $3 limit
        env:
          RADIUM_API_KEY: ${{ secrets.RADIUM_API_KEY }}
        run: |
          python benchmarks/concept_genesis.py --turns 4 --max-repairs 2 --cap-usd 3.00 --output cg1-postrelease-live.json
      - name: Preserve all attempts and validated UCL/2.0 handoffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucl2-postrelease-live-cg1-4turns
          path: |
            cg1-postrelease-dry.json
            cg1-postrelease-live.json
          retention-days: 14
