name: One-time UCL Portable 2.4 evidence grounding test

on:
  push:
    branches: [ucl24-evidence-grounding-once]
    paths:
      - '.github/workflows/ucl24-evidence-grounding-once.yml'

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.created && github.run_attempt == 1 && github.repository == 'ulandort/Universal-Cognitive-Language'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify archive fixture and estimated maximum
        run: python benchmarks/grounding_live_once.py --dry-run
      - name: Install model client
        run: python -m pip install 'openai>=1.0,<3.0'
      - name: Run one fresh evidence assessment
        env:
          RADIUM_API_KEY: ${{ secrets.RADIUM_API_KEY }}
        run: python benchmarks/grounding_live_once.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ucl24-evidence-grounding
          path: |
            grounding-live-report.json
            grounding-live-briefing.json
            grounding-live-answer.json
