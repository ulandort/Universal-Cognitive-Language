name: Publish UCL 2.5.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ucl25-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ucl-2-5-0-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ulandort/Universal-Cognitive-Language' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run release candidate tests
        run: |
          python -m pip install -r requirements-optional.txt
          python -m unittest discover -s tests
          python -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Build and validate downloads from a clean source ZIP
        run: |
          extracted=$(mktemp -d)
          git archive --format=zip --prefix=Universal-Cognitive-Language-2.5.0/ HEAD > "$extracted/source.zip"
          python -m zipfile -e "$extracted/source.zip" "$extracted"
          source="$extracted/Universal-Cognitive-Language-2.5.0"
          bash "$source/tools/build_ucl25_release_assets.sh"
          cp -R "$source/release-assets" .
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
      - name: Publish 2.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.5.0 --json tagName >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/v2.5.0" --jq .sha)" = "$GITHUB_SHA"
          else
            gh release create v2.5.0 release-assets/* \
              --target "$GITHUB_SHA" \
              --title "UCL 2.5.0 — Portable" \
              --notes-file RELEASE_NOTES_2_5.md \
              --latest
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/v2.5.0" --jq .sha)" = "$GITHUB_SHA"
          gh release view v2.5.0 --json tagName,isDraft,isPrerelease,url,assets
