name: UCL 2.0 One-Time Eight-Turn CG-2 Challenge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ucl2-cg2-challenge-once.yml'

permissions:
  contents: read
concurrency:
  group: ucl2-cg2-challenge-one-time
  cancel-in-progress: false

jobs:
  independent_eight_turn_challenge:
    if: github.repository == 'ulandort/Universal-Cognitive-Language' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm stable released UCL 2.0 and free negative/conformance tests
        run: |
          python -m unittest discover -s benchmarks -p 'test_genesis_challenge_8.py' -v
          python benchmarks/genesis_challenge_8.py --dry-run --turns 8 --cap-usd 5 --output cg2-dry.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('cg2-dry.json').read_text())
          assert r['status']=='dry_run' and r['delivered']==8
          assert r['new_definitions_created']==4 and r['receipts_verified']==7
          for row in r['cases']:
              assert json.loads(row['handoff'])['format']=='UCL/2.0-SAP1-PORTABLE'
          print('CG-2 offline eight-turn oracle passed on stable 2.0')
          PY
      - name: Install API client for explicitly authorized live experiment
        run: python -m pip install 'openai>=1.0,<3.0'
      - name: Live 8-turn independent CG-2 research, estimated $5 maximum
        env:
          RADIUM_API_KEY: ${{ secrets.RADIUM_API_KEY }}
        run: |
          python benchmarks/genesis_challenge_8.py --turns 8 --max-repairs 2 --cap-usd 5.00 --output cg2-live.json
      - name: Save full raw attempts, receipts and exact validated packet handoffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucl2-cg2-eight-turn-challenge
          path: |
            cg2-dry.json
            cg2-live.json
          retention-days: 14
