name: One-time UCL 1,000-act sourced reply

on:
  push:
    branches: [ucl-long-join-answer-once]
    paths:
      - '.github/workflows/ucl-long-join-answer-once.yml'

permissions:
  contents: read

jobs:
  join:
    if: github.event.created && github.run_attempt == 1 && github.repository == 'ulandort/Universal-Cognitive-Language'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the offline fixture and continuation
        run: |
          python -m unittest discover -s benchmarks -p test_long_join.py
          python benchmarks/long_join_live_once.py --dry-run
      - name: Install the provider SDK
        run: python -m pip install 'openai>=1.0,<3.0'
      - name: Request a sourced reply to the selected claim
        env:
          RADIUM_API_KEY: ${{ secrets.RADIUM_API_KEY }}
        run: python benchmarks/long_join_live_once.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-join-result
          path: |
            long-join-result.json
            long-join-continued.txt
          retention-days: 14
