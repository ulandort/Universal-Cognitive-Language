name: UCL reference tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Core conformance tests (no dependencies)
        run: python -m unittest discover -s tests -p test_release.py -v
      - name: Portable CLI, current and archived wire compatibility, and hash identity
        run: |
          python -m unittest discover -s tests -p test_ucl2_source_layout.py -v
          python -m unittest discover -s benchmarks -p test_portable_js_interop.py -v
      - name: Agent Skills format and local Portable workflow
        run: python -m unittest discover -s tests -p test_agent_skill.py -v
      - name: Offline long-history lookup, archival, and continuation
        run: |
          python -m unittest discover -s benchmarks -p test_long_join.py -v
          python -m unittest discover -s benchmarks -p test_history_archive.py -v
      - name: Optional security tests
        run: |
          pip install -r requirements-optional.txt
          python -m unittest discover -s tests -p test_security.py -v
