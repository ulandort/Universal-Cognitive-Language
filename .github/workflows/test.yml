name: UCL reference tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core conformance tests (no dependencies)
        run: python -m unittest discover -s tests -p test_release.py -v
      - name: Optional security tests
        run: |
          pip install -r requirements-optional.txt
          python -m unittest discover -s tests -p test_security.py -v
