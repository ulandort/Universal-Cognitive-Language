name: Publish UCL 2.0.1 Source Layout Maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ucl201-once.yml'

permissions:
  contents: write

concurrency:
  group: ucl2-0-1-maintenance-release
  cancel-in-progress: false

jobs:
  verify_and_publish:
    if: github.repository == 'ulandort/Universal-Cognitive-Language' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reference and 2.0 source-layout compatibility tests
        run: |
          python -m unittest discover -s tests -p test_release.py -v
          python -m unittest discover -s tests -p test_ucl2_source_layout.py -v
          python -m unittest discover -s benchmarks -p 'test_*.py' -v
      - name: One thousand deterministic UCLBench adversarial cases
        run: python benchmarks/offline_suite.py --iterations 1000 --seed 2026 --out uclbench-2.0.1-offline.json
      - name: Exact same portable wire through old and new commands
        run: |
          python src/ucl.py encode examples/cross_model_conversation_8_turns.json ucl2-0-1-example.txt
          python tools/sap_portable.py encode examples/cross_model_conversation_8_turns.json legacy-path-example.txt
          cmp ucl2-0-1-example.txt legacy-path-example.txt
          python src/ucl.py check ucl2-0-1-example.txt
          python tools/sap_portable.py check ucl2-0-1-example.txt
          node tools/check_ucl_portable.js ucl2-0-1-example.txt
      - name: Publish non-breaking v2.0.1 maintenance release only once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.0 --json tagName,isDraft,isPrerelease
          if gh release view v2.0.1 >/dev/null 2>&1; then
            echo 'v2.0.1 is already published; refusing to overwrite'
            exit 0
          fi
          cat > release-notes.md <<'END_NOTES'
          UCL/2.0.1 — non-breaking public source organization update.

          - src/ucl.py is now the primary UCL/2.0 CLI and Python API, with Portable encode, decode and auto-detected check.
          - src/portable.py contains the canonical self-contained Portable implementation.
          - src/core.py preserves the original validated inner typed grammar and all 11 core glyphs.
          - src/structural_authoring.py contains the SAP-1 authoring contract.
          - Existing tools/sap_portable.py and benchmark imports still work through small forwarding modules.

          No changes to valid UCL/2.0 packet bytes, definition identities, hashes, symbolic meaning, or external wire format. The v2.0.0 tag remains available for reproducibility. Reference tests, cross-language checks, and a 1,000-case offline benchmark pass.

          See CHANGELOG.md and docs/UCL_2_0_SPECIFICATION.md for details.
          END_NOTES
          gh release create v2.0.1 ucl2-0-1-example.txt \
            --target "$GITHUB_SHA" \
            --title 'UCL/2.0.1 — Stable source consolidation' \
            --notes-file release-notes.md \
            --latest
          gh release view v2.0.1 --json tagName,isDraft,isPrerelease,url
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ucl2-0-1-source-release-verification
          path: |
            uclbench-2.0.1-offline.json
            ucl2-0-1-example.txt
          retention-days: 14
