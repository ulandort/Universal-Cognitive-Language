name: UCL 2.0 Final CCR-1 Completion-Cap Ablation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ucl2-ccr1-16k-once.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ucl2-ccr1-16k-one-shot
  cancel-in-progress: false

jobs:
  completion_cap_replication:
    if: github.repository == 'ulandort/Universal-Cognitive-Language' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load original six-concept CG-2 authentic model transcript
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source
          gh run download 45089101962 --repo "$GITHUB_REPOSITORY" -n ucl2-cg2-eight-turn-challenge --dir source
          test -s source/cg2-live.json
      - name: Validate 16k ablation changes only completion limit and run free oracle
        env:
          CG2_SOURCE_PATH: source/cg2-live.json
        run: |
          python -m unittest discover -s benchmarks -p 'test_cold_continuation.py' -v
          python - <<'PY'
          from pathlib import Path
          a=Path('benchmarks/cold_continuation.py').read_text()
          b=Path('benchmarks/cold_continuation_16k.py').read_text()
          assert 'OUTPUT_LIMIT=8192' in a and 'OUTPUT_LIMIT=16384' in b
          assert b.replace('OUTPUT_LIMIT=16384','OUTPUT_LIMIT=8192').replace(
            'CCR-1B (completion-cap ablation): cold independent continuation',
            'CCR-1: cold independent continuation') == a
          print('Controlled replication differs only in cap and docstring')
          PY
          python benchmarks/cold_continuation_16k.py --source "$CG2_SOURCE_PATH" --dry-run --cap-usd 2.75 --output ccr1b-dry.json
      - name: Install provider SDK only after free verification
        run: python -m pip install 'openai>=1.0,<3.0'
      - name: Rerun the same eight independent UCL challenges with 16k output and $2.75 estimated ceiling
        env:
          RADIUM_API_KEY: ${{ secrets.RADIUM_API_KEY }}
        run: |
          python benchmarks/cold_continuation_16k.py --source source/cg2-live.json --cap-usd 2.75 --max-repairs 1 --output ccr1b-live.json
      - name: Preserve original history and all new authored attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucl2-final-ccr1-16k-ablation
          path: |
            source/cg2-live.json
            ccr1b-dry.json
            ccr1b-live.json
          retention-days: 14
